name: Publish images to GHCR

# 最小發布流程：手動觸發，建置三個產品映像並推送到 GHCR。
# 一律發布 sha-<commit>；填 version 時另發布 <version> 與 latest。
# 不用 tag 觸發：ToukaIDE 的 Marketplace 發行使用 v* tag。
# 只從 main 發布：從其他分支手動觸發時整個 job 跳過，避免把未合併的內容推成 latest。
# 這是唯一有 packages: write 的 workflow，action 一律釘 commit SHA（註解是對應版號）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "映像版號（例如 1.0.0）；留空只發布 sha-<commit>"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: touka-proxy
            context: .
            file: ToukaProxy/Dockerfile
          - image: touka-heartbeat
            context: .
            file: ToukaHeartbeat/Dockerfile
          - image: touka-chat
            context: ToukaChat
            file: ToukaChat/Dockerfile.prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # 不上傳 build record artifact：映像本身已推到 GHCR，紀錄只會佔 Actions 儲存配額。
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # touka-chat 的 context 只有 ToukaChat/，LICENSE／NOTICE 從這個具名 context 取；其他兩個映像用不到。
          build-contexts: |
            touka-root=.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TOUKA_SOURCE_REVISION=${{ github.sha }}
