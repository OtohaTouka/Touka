name: E2E Real

# 實際驗證（ADR-0295）：真前端、真後端（smoke 沙盒）、假模型，不用任何金鑰、不連外部模型。
# 先不列為必過：連續 20 次沒有因為測試不穩而失敗，再由維護者決定要不要改成必過。

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-real-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ToukaChat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-packages --python 3.12
        working-directory: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - run: npm install -g --ignore-scripts --no-audit --no-fund npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:real
        env:
          E2E_REAL_OUTPUT_DIR: ${{ runner.temp }}/e2e-real-output
      # 截圖與失敗時的 trace 給人核對；內容只有沙盒假資料與用完就丟的測試帳號
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-real-output
          path: ${{ runner.temp }}/e2e-real-output
          retention-days: 7
          if-no-files-found: warn
