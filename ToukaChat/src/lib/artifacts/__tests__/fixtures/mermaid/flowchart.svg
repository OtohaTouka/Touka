<svg id="fx-flowchart" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 282px;" viewBox="0 0 282 334" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#fx-flowchart{font-family:monospace;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#fx-flowchart .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#fx-flowchart .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#fx-flowchart .error-icon{fill:transparent;}#fx-flowchart .error-text{fill:transparent;stroke:transparent;}#fx-flowchart .edge-thickness-normal{stroke-width:1px;}#fx-flowchart .edge-thickness-thick{stroke-width:3.5px;}#fx-flowchart .edge-pattern-solid{stroke-dasharray:0;}#fx-flowchart .edge-thickness-invisible{stroke-width:0;fill:none;}#fx-flowchart .edge-pattern-dashed{stroke-dasharray:3;}#fx-flowchart .edge-pattern-dotted{stroke-dasharray:2;}#fx-flowchart .marker{fill:lightgrey;stroke:lightgrey;}#fx-flowchart .marker.cross{stroke:lightgrey;}#fx-flowchart svg{font-family:monospace;font-size:16px;}#fx-flowchart p{margin:0;}#fx-flowchart .label{font-family:monospace;color:#ccc;}#fx-flowchart .cluster-label text{fill:#F9FFFE;}#fx-flowchart .cluster-label span{color:#F9FFFE;}#fx-flowchart .cluster-label span p{background-color:transparent;}#fx-flowchart .label text,#fx-flowchart span{fill:#ccc;color:#ccc;}#fx-flowchart .node rect,#fx-flowchart .node circle,#fx-flowchart .node ellipse,#fx-flowchart .node polygon,#fx-flowchart .node path{fill:#1f2020;stroke:#ccc;stroke-width:1px;}#fx-flowchart .rough-node .label text,#fx-flowchart .node .label text,#fx-flowchart .image-shape .label,#fx-flowchart .icon-shape .label{text-anchor:middle;}#fx-flowchart .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#fx-flowchart .rough-node .label,#fx-flowchart .node .label,#fx-flowchart .image-shape .label,#fx-flowchart .icon-shape .label{text-align:center;}#fx-flowchart .node.clickable{cursor:pointer;}#fx-flowchart .root .anchor path{fill:lightgrey!important;stroke-width:0;stroke:lightgrey;}#fx-flowchart .arrowheadPath{fill:lightgrey;}#fx-flowchart .edgePath .path{stroke:lightgrey;stroke-width:1px;}#fx-flowchart .flowchart-link{stroke:lightgrey;fill:none;}#fx-flowchart .edgeLabel{background-color:hsl(0, 0%, 34.4117647059%);text-align:center;}#fx-flowchart .edgeLabel p{background-color:hsl(0, 0%, 34.4117647059%);}#fx-flowchart .edgeLabel rect{opacity:0.5;background-color:hsl(0, 0%, 34.4117647059%);fill:hsl(0, 0%, 34.4117647059%);}#fx-flowchart .labelBkg{background-color:rgba(87.75, 87.75, 87.75, 0.5);}#fx-flowchart .cluster rect{fill:hsl(180, 1.5873015873%, 28.3529411765%);stroke:rgba(255, 255, 255, 0.25);stroke-width:1px;}#fx-flowchart .cluster text{fill:#F9FFFE;}#fx-flowchart .cluster span{color:#F9FFFE;}#fx-flowchart div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:monospace;font-size:12px;background:hsl(20, 1.5873015873%, 12.3529411765%);border:1px solid rgba(255, 255, 255, 0.25);border-radius:2px;pointer-events:none;z-index:100;}#fx-flowchart .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#ccc;}#fx-flowchart rect.text{fill:none;stroke-width:0;}#fx-flowchart .icon-shape,#fx-flowchart .image-shape{background-color:hsl(0, 0%, 34.4117647059%);text-align:center;}#fx-flowchart .icon-shape p,#fx-flowchart .image-shape p{background-color:hsl(0, 0%, 34.4117647059%);padding:2px;}#fx-flowchart .icon-shape .label rect,#fx-flowchart .image-shape .label rect{opacity:0.5;background-color:hsl(0, 0%, 34.4117647059%);fill:hsl(0, 0%, 34.4117647059%);}#fx-flowchart .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#fx-flowchart .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#fx-flowchart .node .neo-node{stroke:#ccc;}#fx-flowchart [data-look="neo"].node rect,#fx-flowchart [data-look="neo"].cluster rect,#fx-flowchart [data-look="neo"].node polygon{stroke:url(#fx-flowchart-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fx-flowchart [data-look="neo"].swimlane.cluster rect{filter:none;}#fx-flowchart [data-look="neo"].node path{stroke:url(#fx-flowchart-gradient);stroke-width:1px;}#fx-flowchart [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fx-flowchart [data-look="neo"].node .neo-line path{stroke:#ccc;filter:none;}#fx-flowchart [data-look="neo"].node circle{stroke:url(#fx-flowchart-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fx-flowchart [data-look="neo"].node circle .state-start{fill:#000000;}#fx-flowchart [data-look="neo"].icon-shape .icon{fill:url(#fx-flowchart-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fx-flowchart [data-look="neo"].icon-shape .icon-neo path{stroke:url(#fx-flowchart-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#fx-flowchart :root{--mermaid-font-family:monospace;}</style><g><marker id="fx-flowchart_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="fx-flowchart_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="fx-flowchart_flowchart-v2-pointEnd-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto"><path d="M 0 0 L 1