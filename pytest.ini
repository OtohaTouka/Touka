[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
norecursedirs = archived
markers =
    isolation_linux: real-kernel isolation tests (Landlock, unix sockets); Linux only
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# -r replaces pytest's default "fE": keep failures (f) and errors (E), add skip reasons (s).
addopts = -rfEs
log_cli = true
log_cli_level = INFO
