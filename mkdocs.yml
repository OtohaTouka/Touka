site_name: Touka System Manual
repo_url: https://github.com/OtohaTouka/Touka
repo_name: OtohaTouka/Touka
use_directory_urls: false

theme:
  name: material
  language: zh-Hant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 切换至淺色模式
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - ToukaProxy/src
            - ToukaMemory/src
            - ToukaHeartbeat
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_category_heading: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg

nav:
  - 首頁: index.md
  - 🏗️ 架構設計 (Architecture):
      - "架構決策紀錄 (ADR) 索引": architecture/adr/README.md
      - "ADR-0207 MCP Workload OAuth": architecture/adr/0207-mcp-workload-oauth-single-proxy.md
      - "ADR-0208 Model Route Credential Atomicity": architecture/adr/0208-model-route-provenance-and-credential-atomicity.md
      - "設計提案（歷史）說明": architecture/proposals/README.md
      - "MCP 2026 P8-B Workload OAuth 計畫": architecture/proposals/mcp-2026-p8b-workload-oauth-plan.md
      - SSOT 主地圖: architecture/SSOT_MASTER_MAP.md
      - Proxy 介面規範: architecture/PROXY_INTERFACE.md
      - Memory 介面規範: architecture/MEMORY_INTERFACE.md
      - Heartbeat 介面規範: architecture/HEARTBEAT_INTERFACE.md
      - Chat 介面規範: architecture/CHAT_INTERFACE.md
      - IDE 介面規範: architecture/IDE_INTERFACE.md
