# ADR-0117：uv workspace 成員（單一 uv.lock 的抽象相依來源／禁令 53）。
# 改依賴：改本檔 dependencies → 根目錄 `uv lock` → `uv sync --all-packages` → commit uv.lock。
[project]
name = "toukadispatch"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "mcp==2.2.0",
    # MCP HTTP server runner 直接使用 uvicorn；明確釘版與 Proxy/Heartbeat 統一。
    "uvicorn~=0.41.0",
    # P4-A 將 modern /mcp 與 legacy /sse 合併為單一 ASGI app；屬直接 import。
    "starlette~=1.3.1",
    "pydantic~=2.12.5",
    "python-dotenv~=1.2.2",
    "httpx~=0.28.1",
    "filelock~=4.2.4",
]

[tool.uv]
package = false
